<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipes || Final</title>
    <!-- favicon -->
    <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon" />
    <!-- normalize -->
    <link rel="stylesheet" href="./css/normalize.css" />
    <!-- font-awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css" />
    <!-- main css -->
    <link rel="stylesheet" href="./css/main.css" />
  </head>

  <body>
    <!-- nav  -->
    <nav class="navbar">
      <div class="nav-center">
        <div class="nav-header">
          <a href="index.html" class="nav-logo">
            <img src="./assets/logo.svg" alt="simply recipes" />
          </a>
          <button class="nav-btn btn">
            <i class="fas fa-align-justify"></i>
          </button>
        </div>
        <div class="nav-links">
          <a href="index.html" class="nav-link">home</a>
          <a href="about.html" class="nav-link">about</a>
          <a href="tags.html" class="nav-link">tags</a>
          <a href="recipes.html" class="nav-link">recipes</a>

          <div class="nav-link contact-link">
            <a href="contact.html" class="btn">contact</a>
          </div>
        </div>
      </div>
    </nav>
    <!-- end of nav -->
    <!-- main -->
    <main class="page">
      <section class="recipes-container">
        <!-- tag container -->
        <div class="tags-container">
          <h4>recipes</h4>
          <div class="tags-list" id="tags-list"></div>
          <script>
            (async function () {
              const res = await fetch('recipes.json');
              const all = await res.json();
              const tagCounts = all.reduce((acc, r) => {
                (r.tags || []).forEach(t => acc[t] = (acc[t] || 0) + 1);
                return acc;
              }, {});
              const html = Object.entries(tagCounts)
                .sort(([a], [b]) => a.localeCompare(b))
                .map(([tag, count]) => `<a href="tag-template.html?tag=${encodeURIComponent(tag)}">${tag} (${count})</a>`)
                .join('');
              document.getElementById('tags-list').innerHTML = html;
            })();
          </script>

        </div>
        <!-- end of tag container -->
        <!-- recipes list -->
        <div class="recipes-list" id="recipes-list"></div>
        <script>
          (async function () {
            const res = await fetch('recipes.json');
            const all = await res.json();

            const list = document.getElementById('recipes-list');
            list.innerHTML = all.map(r => `
            <a href="single-recipe.html?slug=${encodeURIComponent(r.slug)}" class="recipe">
              <img src="${r.image}" class="img recipe-img" alt="${r.title}" loading="lazy" />
              <h5>${r.title}</h5>
              <p>${r.description}</p>
            </a>
          `).join('');
          })();
        </script>

      </section>
    </main>
    <!-- end of main -->
    <!-- footer -->
    <footer class="page-footer">
      <p>
        &copy;
        <span id="date"></span>
        <span class="footer-logo">Recipes</span>
        handcrafted by
        <a href="https://www.hdestudios.com/">E.H. hdestudios.com</a>
      </p>
    </footer>
    <script src="./js/app.js"></script>
  </body>

</html>
