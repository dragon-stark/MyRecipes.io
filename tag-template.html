<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recipes by Tag | My Recipes</title>

    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/main.css" />
    <script defer src="js/app.js"></script>
  </head>

  <body>
    <nav class="navbar">
      <div class="nav-center">
        <div class="nav-header">
          <a href="index.html" class="nav-logo">My Recipes</a>
          <button class="btn nav-btn" aria-label="toggle navigation">
            <i class="fas fa-align-justify" aria-hidden="true"></i>
          </button>
        </div>
        <div class="nav-links">
          <a href="index.html" class="nav-link">home</a>
          <a href="recipes.html" class="nav-link">recipes</a>
          <a href="tags.html" class="nav-link">tags</a>
        </div>
      </div>
    </nav>

    <main class="page">
      <section class="recipes-container">
        <h1 id="tag-title" class="page-title">#tag</h1>
        <div class="recipes-list" id="tag-results" aria-live="polite"></div>
      </section>
    </main>

    <footer class="page-footer">
      <p>&copy; <span id="date"></span> My Recipes</p>
    </footer>

    <script>
      (async function () {
        try {
          // subfolder-safe fetch helper (works at / and /MyRecipes.io/)
          const basePath = (function () {
            const parts = location.pathname.split('/');
            if (parts.length && /\.html?$/.test(parts[parts.length - 1])) parts.pop();
            return parts.join('/') || '/';
          })();
          const join = (a, b) => (a.endsWith('/') ? a.slice(0, -1) : a) + '/' + (b.startsWith('/') ? b.slice(1) : b);

          const params = new URLSearchParams(location.search);
          const tag = params.get('tag');

          const titleEl = document.getElementById('tag-title');
          const listEl = document.getElementById('tag-results');

          if (!tag) {
            titleEl.textContent = 'No tag selected';
            listEl.innerHTML = '<p>Select a tag on the <a href="tags.html">tags</a> page.</p>';
            return;
          }

          titleEl.textContent = '#' + tag;

          const res = await fetch(join(basePath, 'recipes.json'), { cache: 'no-store' });
          if (!res.ok) throw new Error('recipes.json not found');
          const all = await res.json();

          const items = all.filter(r => (r.tags || []).includes(tag));
          if (items.length === 0) {
            listEl.innerHTML = `<p>No recipes for <strong>#${tag}</strong> yet.</p>`;
            return;
          }

          listEl.innerHTML = items.map(r => `
        <a class="recipe" href="single-recipe.html?slug=${encodeURIComponent(r.slug)}">
          <img class="img recipe-img" src="${r.image}" alt="${r.title}" loading="lazy" />
          <h5>${r.title}</h5>
          <p>${r.description || ''}</p>
          <small>${(r.tags || []).join(', ')}</small>
        </a>
      `).join('');
        } catch (err) {
          console.error(err);
          const listEl = document.getElementById('tag-results');
          if (listEl) listEl.innerHTML = '<p>Could not load tag results. Check console.</p>';
        }
      })();
    </script>

    <script src="https://kit.fontawesome.com/a2e0e6ad5b.js" crossorigin="anonymous"></script>
  </body>

</html>
