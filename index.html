<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipes || Recetas</title>
    <!-- favicon -->
    <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon" />
    <!-- normalize -->
    <link rel="stylesheet" href="./css/normalize.css" />
    <!-- font-awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css" />
    <!-- main css -->
    <link rel="stylesheet" href="./css/main.css" />
  </head>

  <body>
    <!-- nav  -->
    <nav class="navbar">
      <div class="nav-center">
        <div class="nav-header">
          <a href="index.html" class="nav-logo">
            <img src="./assets/logo.svg" alt="simply recipes" />
          </a>
          <button class="nav-btn btn" aria-label="toggle navigation">
            <i class="fas fa-align-justify" aria-hidden="true"></i>
          </button>
        </div>
        <div class="nav-links">
          <a href="index.html" class="nav-link">home</a>
          <a href="about.html" class="nav-link">about</a>
          <a href="tags.html" class="nav-link">tags</a>
          <a href="recipes.html" class="nav-link">recipes</a>

          <div class="nav-link contact-link">
            <a href="contact.html" class="btn">contact</a>
          </div>
        </div>
      </div>
    </nav>
    <!-- end of nav -->

    <!-- main -->
    <main class="page">
      <!-- header -->
      <header class="hero">
        <div class="hero-container">
          <div class="hero-text">
            <h1>family recipes</h1>
            <h4>nuestras recetas</h4>
          </div>
        </div>
      </header>
      <!-- end of header -->

      <section class="recipes-container">
        <!-- tag container (dynamic) -->
        <div class="tags-container">
          <h4>recipes</h4>
          <div class="tags-list" id="home-tags"></div>
        </div>
        <!-- end of tag container -->

        <!-- recipes list (dynamic featured) -->
        <div class="recipes-list" id="home-featured"></div>
      </section>
    </main>
    <!-- end of main -->

    <!-- footer -->
    <div id="footer"></div>
    <script>
      fetch("./footer.html")
        .then(res => res.text())
        .then(html => {
          document.getElementById("footer").innerHTML = html;
        });
    </script>


    <script src="./js/app.js"></script>

    <!-- Dynamic home: tags + featured from recipes.json (subfolder safe) -->
    <script>
      (async function () {
        try {
          // Base path that works locally and on GitHub Pages
          const basePath = (function () {
            const parts = location.pathname.split("/");
            if (parts.length && /\.html?$/.test(parts[parts.length - 1])) parts.pop();
            return parts.join("/") || "/";
          })();
          const join = (a, b) =>
            (a.endsWith("/") ? a.slice(0, -1) : a) + "/" + (b.startsWith("/") ? b.slice(1) : b);

          const dataUrl = join(basePath, "recipes.json");
          const res = await fetch(dataUrl, { cache: "no-store" });
          if (!res.ok) throw new Error("recipes.json not found at " + dataUrl);
          const recipes = await res.json();

          // ----- TAGS: top 6 by count -----
          const counts = recipes.reduce((acc, r) => {
            (r.tags || []).forEach(t => acc[t] = (acc[t] || 0) + 1);
            return acc;
          }, {});
          const topTags = Object.entries(counts)
            .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
            .slice(0, 6);

          const tagsHost = document.getElementById("home-tags");
          tagsHost.innerHTML = topTags.map(([tag, count]) =>
            `<a href="./tag-template.html?tag=${encodeURIComponent(tag)}">${tag} (${count})</a>`
          ).join("");

          // ----- FEATURED: first 4 A→Z by title for determinism -----
          const featured = [...recipes]
            .sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: "base" }))
            .slice(0, 4);

          const featHost = document.getElementById("home-featured");
          featHost.innerHTML = featured.map(r => `
            <a href="./single-recipe.html?slug=${encodeURIComponent(r.slug)}" class="recipe">
              <img
                src="${r.image}"
                class="img recipe-img"
                alt="${r.title}"
                loading="lazy"
              />
              <h5>${r.title}</h5>
              <p>${r.description || ""}</p>
            </a>
          `).join("");
        } catch (err) {
          console.error(err);
          const featHost = document.getElementById("home-featured");
          if (featHost) featHost.innerHTML = "<p>Could not load recipes. Try again.</p>";
        }
      })();
    </script>
  </body>

</html>
