<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Single Recipe || Final</title>
    <!-- favicon -->
    <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon" />
    <!-- normalize -->
    <link rel="stylesheet" href="./css/normalize.css" />
    <!-- font-awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css" />
    <!-- main css -->
    <link rel="stylesheet" href="./css/main.css" />
  </head>

  <!-- dynamic loader -->
  <script>
    (async function () {
      try {
        // subfolder-safe base path (works locally and on GitHub Pages)
        const basePath = (function () {
          const parts = location.pathname.split("/");
          if (parts.length && /\.html?$/.test(parts[parts.length - 1])) parts.pop();
          return parts.join("/") || "/";
        })();
        const join = (a, b) =>
          (a.endsWith("/") ? a.slice(0, -1) : a) + "/" + (b.startsWith("/") ? b.slice(1) : b);

        // 1) read slug from query
        const slug = new URLSearchParams(location.search).get('slug');

        const dataUrl = join(basePath, "recipes.json");
        const res = await fetch(dataUrl, { cache: 'no-store' });
        if (!res.ok) throw new Error('recipes.json not found at ' + dataUrl);
        const all = await res.json();

        // STRICT: no fallback; show a clear Not Found if bad/missing slug
        const r = all.find(x => x.slug === slug);
        if (!slug || !r) {
          document.body.innerHTML = `
            <main class="page">
              <section class="recipes-container">
                <h1>Recipe not found</h1>
                <p>We couldn’t find a recipe for <code>${slug || '(no slug given)'}</code>.</p>
                <p><a href="./recipes.html">Back to all recipes</a></p>
              </section>
            </main>`;
          return;
        }

        // 2) fill content
        document.getElementById('recipe-title').textContent = r.title;
        document.getElementById('recipe-desc').textContent = r.description || '';

        const img = document.getElementById('recipe-image');
        img.src = r.image;
        img.alt = r.title;

        document.getElementById('recipe-prep').textContent =
          r.prepTime ? r.prepTime.replace(/^PT/, '').toLowerCase() : '—';
        document.getElementById('recipe-cook').textContent =
          r.cookTime ? r.cookTime.replace(/^PT/, '').toLowerCase() : '—';
        document.getElementById('recipe-yield').textContent = r.yield || '—';

        document.getElementById('recipe-tags').innerHTML =
          (r.tags || []).map(t =>
            `<a href="tag-template.html?tag=${encodeURIComponent(t)}">${t}</a>`
          ).join('');

        document.getElementById('ingredients').innerHTML =
          (r.ingredients || []).map(i => `<p class="single-ingredient">${i}</p>`).join('');

        document.getElementById('instructions').innerHTML =
          (r.instructions || []).map((step, i) => `
            <div class="single-instruction">
              <header><p>step ${i + 1}</p><div></div></header>
              <p>${step}</p>
            </div>
          `).join('');

        // tools rendering (data-driven)
        const toolsHost = document.getElementById('tools');
        if (toolsHost) {
          const tools = (r.tools || []);
          toolsHost.innerHTML = tools.length
            ? tools.map(t => `<p class="single-tool">${t}</p>`).join('')
            : `<p class="single-tool">No special tools listed</p>`;
        }

        // 3) JSON-LD for rich results
        const ld = {
          "@context": "https://schema.org",
          "@type": "Recipe",
          "name": r.title,
          "description": r.description || "",
          "image": [r.image],
          "recipeIngredient": r.ingredients || [],
          "recipeInstructions": (r.instructions || []).map(txt => ({ "@type": "HowToStep", "text": txt })),
          "totalTime": r.totalTime || undefined,
          "prepTime": r.prepTime || undefined,
          "cookTime": r.cookTime || undefined,
          "recipeYield": r.yield || undefined,
          "keywords": (r.tags || []).concat(r.tools || []).join(", ")
        };
        const s = document.createElement('script');
        s.type = 'application/ld+json';
        s.textContent = JSON.stringify(ld);
        document.head.appendChild(s);

      } catch (err) {
        console.error(err);
        const host = document.querySelector('main.page');
        if (host) {
          host.innerHTML = '<section class="recipes-container"><h1>Error loading recipe</h1></section>';
        } else {
          document.body.innerHTML = '<main class="page"><h1>Error loading recipe</h1></main>';
        }
      }
    })();
  </script>

  <body>
    <!-- nav  -->
    <nav class="navbar">
      <div class="nav-center">
        <div class="nav-header">
          <a href="index.html" class="nav-logo">
            <img src="./assets/logo.svg" alt="simply recipes" />
          </a>
          <button class="nav-btn btn" aria-label="toggle navigation">
            <i class="fas fa-align-justify" aria-hidden="true"></i>
          </button>
        </div>
        <div class="nav-links">
          <a href="index.html" class="nav-link">home</a>
          <a href="about.html" class="nav-link">about</a>
          <a href="tags.html" class="nav-link">tags</a>
          <a href="recipes.html" class="nav-link">recipes</a>

          <div class="nav-link contact-link">
            <a href="contact.html" class="btn">contact</a>
          </div>
        </div>
      </div>
    </nav>
    <!-- end of nav -->

    <main class="page">
      <div class="recipe-page">
        <section class="recipe-hero">
          <img id="recipe-image" class="img recipe-hero-img" alt="" />
          <article class="recipe-info">
            <h2 id="recipe-title"></h2>
            <p id="recipe-desc"></p>
            <div class="recipe-icons">
              <article>
                <i class="fas fa-clock"></i>
                <h5>prep time</h5>
                <p id="recipe-prep">—</p>
              </article>
              <article>
                <i class="far fa-clock"></i>
                <h5>cook time</h5>
                <p id="recipe-cook">—</p>
              </article>
              <article>
                <i class="fas fa-user-friends"></i>
                <h5>servings</h5>
                <p id="recipe-yield">—</p>
              </article>
            </div>
            <p class="recipe-tags" id="recipe-tags"></p>
          </article>
        </section>

        <!-- content -->
        <section class="recipe-content">
          <article>
            <h4>instructions</h4>
            <div id="instructions"></div>
          </article>
          <article class="second-column">
            <div>
              <h4>ingredients</h4>
              <div id="ingredients"></div>
            </div>
            <div>
              <h4>tools</h4>
              <!-- dynamic tools will be injected here -->
              <div id="tools"></div>
            </div>
          </article>
        </section>
      </div>
    </main>

    <!-- footer -->
    <div id="footer"></div>

    <script src="./js/app.js"></script>
    <script src="./js/footer.js"></script>
  </body>

</html>
